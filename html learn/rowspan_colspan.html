<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowspan and Colspan</title>
</head>

<body>
    <h2>This is a simple table with colspan</h2>
    <table border="2" style="width: 50%; text-align: center;">
        <tr>
            <th>Name</th>
            <th colspan="3">Phone Number</th>
        </tr>

        <tr>
            <td>Maria Akter Mukti</td>
            <td>123-456-7890</td>
            <td>123-543-2532</td>
        </tr>
        <tr>
            <td>Mostafizur Rahman</td>
            <td>987-654-3210</td>
            <td>987-543-2109</td>
            <td>987-543-2009</td>
        </tr>

    </table>

    <body>
        <h2>This is a simple table with rowspan</h2>

        <table border="2">
            <tr>
                <th rowspan="4">Students</th>
                <th>First Name</th>
                <th>Last Name</th>
            </tr>

            <tr>
                <td>Maria</td>
                <td>Mukti</td> 
            </tr> 
            <tr>
                <td>Mostafizur</td>
                <td>Rahman</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Doe</td>
            </tr>            

        </table>
    </body>



    
</body>
</html>
